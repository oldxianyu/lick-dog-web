<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="g" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ff92c0" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ff4fa0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#ffffff"/>
  <circle cx="256" cy="256" r="210" fill="url(#g)"/>

  <!-- Shiba head base -->
  <g filter="url(#softGlow)">
    <!-- ears -->
    <path d="M150 180 L210 160 L205 215 Z" fill="#f5a45a"/>
    <path d="M362 180 L302 160 L307 215 Z" fill="#f5a45a"/>

    <!-- head -->
    <ellipse cx="256" cy="290" rx="150" ry="135" fill="#f2b067"/>
    <ellipse cx="256" cy="305" rx="125" ry="105" fill="#fff1dd"/>

    <!-- eyes -->
    <circle cx="215" cy="280" r="12" fill="#2a2230"/>
    <circle cx="297" cy="280" r="12" fill="#2a2230"/>

    <!-- nose & mouth -->
    <path d="M256 308 c12 0 18 8 18 16 0 10-10 18-18 18s-18-8-18-18c0-8 6-16 18-16z" fill="#2a2230"/>
    <path d="M238 346 q18 14 36 0" stroke="#2a2230" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- subtle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ff69b4" stroke-opacity="0.25" stroke-width="8"/>
</svg>
