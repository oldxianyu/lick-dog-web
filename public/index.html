<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>舔狗日记 · LICK.DOG</title>
  <meta name="description" content="舔狗日记 · 随机一句 · 一键复制 · 匿名投稿" />
  <!-- cache-busted icons -->
  <link rel="icon" href="/shiba_preview.svg?v=d5ad720" type="image/svg+xml" />
  <link rel="shortcut icon" href="/shiba_32.png?v=d5ad720" type="image/png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/shiba_16.png?v=d5ad720" />
  <link rel="icon" type="image/png" sizes="32x32" href="/shiba_32.png?v=d5ad720" />
  <link rel="icon" type="image/png" sizes="48x48" href="/shiba_48.png?v=d5ad720" />
  <link rel="icon" type="image/png" sizes="192x192" href="/shiba_256.png?v=d5ad720" />
  <link rel="icon" type="image/png" sizes="512x512" href="/shiba_512.png?v=d5ad720" />
  <link rel="apple-touch-icon" sizes="180x180" href="/shiba_180.png?v=d5ad720" />
  <link rel="mask-icon" href="/shiba_preview.svg?v=d5ad720" color="#ff3d8c" />
  <meta name="theme-color" content="#ff3d8c" />
  <style>
    /* 桌面端放大 1.25x；移动端保持 1.0，避免错位与糊感 */
    @media (min-width: 1100px){
      html{transform:scale(1.25);transform-origin: top center}
    }
    body{overflow-x:hidden}
    /* 移动端隐藏鼠标光晕 */
    @media (hover: none), (pointer: coarse){
      .cursor-glow{display:none}
    }

    :root{
      --bg:#faf7fb;           /* 浅底 */
      --text:#2a2230;         /* 正文 */
      --muted:#7a6c84;        /* 次要文字 */
      --primary:#ff3d8c;      /* 品红主色 */
      --primary2:#ff6aa8;     /* 品红渐变 */
      --card:#ffffff;         /* 卡片底 */
      --border:#ead8e4;       /* 边框淡粉 */
      --shadow:0 10px 30px rgba(255,61,140,.15);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family: Inter, "PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;color:var(--text);background:
      radial-gradient(1000px 500px at 20% -10%, rgba(255,61,140,.12), transparent 45%),
      radial-gradient(800px 500px at 80% -20%, rgba(255,106,168,.10), transparent 40%),
      var(--bg);
    }

    /* 背景画布与鼠标光晕 */
    .bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
    .cursor-glow{position:fixed;top:0;left:0;width:220px;height:220px;border-radius:50%;
      pointer-events:none;z-index:9;mix-blend-mode:screen;opacity:.9;
      background: radial-gradient(45% 45% at 50% 50%, rgba(255,61,140,.65), rgba(255,106,168,.35) 60%, transparent 72%);
      filter: blur(20px); transform: translate(-9999px,-9999px);
    }

    .container{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:24px 18px 40px}

    /* 顶部（上） */
    header{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.02em}
    .logo-badge{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 10px 24px rgba(255,61,140,.35)}
    nav a{color:var(--muted);text-decoration:none;margin-left:14px;font-size:14px}
    .btn{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--text);font-weight:700;cursor:pointer}
    .btn-primary{border:none;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 12px 28px rgba(255,61,140,.28)}

    /* 主区域（下） */
    .hero{margin-top:28px;text-align:center}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--primary);font-weight:700;font-size:12px}
    .pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
    h1{margin:10px auto 8px;font-size:clamp(34px,6vw,56px);line-height:1.06;letter-spacing:-.02em}
    .sub{margin:0 auto;color:var(--muted);max-width:44rem;line-height:1.8}

    .quote-card{margin:22px auto 0;max-width:820px;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:26px 20px 54px;position:relative;cursor:pointer}
    .quote-mark{font-size:40px;color:#efc7da}
    #quote{font-size:clamp(18px,2.4vw,24px);line-height:1.8;white-space:pre-wrap;word-break:break-word}
    .hint{position:absolute;left:18px;bottom:14px;font-size:12px;color:#a78da1}

    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}

    .features{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
    .feature{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 14px;box-shadow:0 8px 20px rgba(255,61,140,.08)}
    .feature h3{margin:0 0 6px;font-size:16px}
    .feature p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}

    footer{margin:28px 0 6px;text-align:center;color:#a78da1;font-size:12px}

    /* 移动端排版优化 */
    @media (max-width: 780px){
      .container{padding:18px 14px 28px}
      h1{font-size:clamp(28px,8vw,40px)}
      .quote-card{padding:20px 14px 46px}
      .actions{gap:10px}
      .features{grid-template-columns:1fr}
    }

    /* 投稿弹窗 */
    .modal-wrap{position:fixed;inset:0;background:rgba(42,34,48,.36);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
    .modal{width:min(520px,100%);background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 20px 50px rgba(42,34,48,.18)}
    .modal h2{margin:0 0 6px}
    .modal p{margin:0 0 10px;color:#7a6c84}
    textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--border);padding:12px;resize:vertical;font:inherit}
    textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,61,140,.15)}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}

    /* 轻提示 */
    .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:#fff;color:var(--text);font-weight:800;box-shadow:0 14px 36px rgba(42,34,48,.16);opacity:0;pointer-events:none;transition:.25s;z-index:20}
    .toast.show{opacity:1}

    @media (max-width:780px){.features{grid-template-columns:1fr}}

    /* Uiverse-like neon glow for wordmark and buttons */
    .glow-text{
      color: var(--primary);
      text-shadow:
        0 0 6px rgba(255,61,140,.55),
        0 0 12px rgba(255,61,140,.45),
        0 0 22px rgba(255,61,140,.35);
      animation: glowPulse 2.6s ease-in-out infinite;
      letter-spacing: .04em;
    }
    @keyframes glowPulse{
      0%,100%{ text-shadow:
        0 0 6px rgba(255,61,140,.55),
        0 0 12px rgba(255,61,140,.45),
        0 0 22px rgba(255,61,140,.35);
      }
      50%{ text-shadow:
        0 0 10px rgba(255,61,140,.75),
        0 0 24px rgba(255,61,140,.55),
        0 0 40px rgba(255,61,140,.45);
      }
    }

    .btn-primary{ position: relative; }
    .btn-primary::after{
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: radial-gradient(60% 60% at 50% 50%, rgba(255,61,140,.45), transparent 60%);
      filter: blur(12px);
      opacity: 0;
      transition: opacity .2s ease;
      z-index: -1;
    }
    .btn-primary:hover::after{ opacity: .85; }

    .quote-card:hover{ box-shadow: 0 14px 36px rgba(255,61,140,.18), var(--shadow); }
    /* SoundCode 风格按钮（参考 hereitis 效果，保持干净 + 轻扫光） */
    .btn-sound{position:relative;display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 18px;border-radius:14px;border:none;background:transparent;color:var(--text);font-weight:900;letter-spacing:.02em;cursor:pointer;transition:transform .15s ease}
    .btn-sound:hover{transform:translateY(-1px)}
    .btn-sound:active{transform:translateY(0)}
    /* 外层渐变描边 */
    .btn-sound::before{content:"";position:absolute;inset:0;border-radius:14px;padding:2px;background:linear-gradient(120deg,var(--primary),var(--primary2),#7f5bff,var(--primary));background-size:300% 300%;animation:btnFlow 3.2s linear infinite;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
    /* 内胆 */
    .btn-sound::after{content:"";position:absolute;inset:2px;border-radius:12px;background:#fff;opacity:.94}
    .btn-sound > span{position:relative;z-index:1}
    /* 扫光条 */
    .btn-sound .shine{position:absolute;inset:2px;border-radius:12px;overflow:hidden;}
    .btn-sound .shine::before{content:"";position:absolute;top:-20%;bottom:-20%;left:-60%;width:40%;transform:skewX(-20deg);background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.45) 50%, rgba(255,255,255,0) 100%);filter:blur(2px);animation:shineSweep 2.8s ease-in-out infinite}
    .btn-sound:hover .shine::before{animation-duration:1.8s}

    .btn-sound-primary{color:#fff}
    .btn-sound-primary::after{background:linear-gradient(135deg,var(--primary),var(--primary2))}
    .btn-sound-primary::before{filter:blur(6px);opacity:.9}

    /* 搭配款：描边为主（透明内胆） */
    .btn-sound-outline{color:var(--primary)}
    .btn-sound-outline::after{background:rgba(255,255,255,.04)}
    .btn-sound-outline::before{opacity:.7;filter:blur(6px)}

    /* 搭配款：柔和白内胆（无扫光） */
    .btn-sound-soft{color:var(--text)}
    .btn-sound-soft .shine{display:none}
    .btn-sound-soft::after{background:#fff;opacity:.92}
    .btn-sound-soft::before{opacity:.5;filter:blur(4px)}

    /* 吸睛款：投稿按钮专用（轻呼吸 + 柔粉内胆 + 微扫光 + 跳动） */
    .btn-sound-accent{color:#2a2230}
    .btn-sound-accent::after{background:linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,245,250,.96))}
    .btn-sound-accent::before{opacity:.9;filter:blur(10px)}
    .btn-sound-accent .shine{position:absolute;inset:2px;border-radius:12px;overflow:hidden}
    .btn-sound-accent .shine::before{content:"";position:absolute;top:-20%;bottom:-20%;left:-60%;width:36%;transform:skewX(-20deg);background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.42) 50%, rgba(255,255,255,0) 100%);filter:blur(2px);animation:shineSweep 3.2s ease-in-out infinite}
    /* 心跳动效（矩形按钮） */
    .btn-sound-accent{animation:heartBeat 1.6s ease-in-out infinite, gPulse 2.8s ease-in-out infinite}
    .btn-sound-accent:hover{transform:none}

    @keyframes gPulse{0%,100%{filter:drop-shadow(0 8px 18px rgba(255,61,140,.20))}50%{filter:drop-shadow(0 12px 28px rgba(255,61,140,.34))}}
    @keyframes heartBeat{0%{transform:scale(1)}14%{transform:scale(1.06)}28%{transform:scale(1)}42%{transform:scale(1.04)}70%{transform:scale(1)}}

    @keyframes btnFlow{0%{background-position:0% 50%}100%{background-position:100% 50%}}
    @keyframes shineSweep{0%{left:-60%}100%{left:130%}}

    /* 桃花运占卜 */
    .peach-section{margin-top:32px}
    .peach-card{max-width:600px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:28px 24px 24px;text-align:center;position:relative;overflow:hidden}
    .peach-card::before{content:"🌸";position:absolute;top:-18px;right:-18px;font-size:80px;opacity:.12;pointer-events:none}
    .peach-card h2{margin:0 0 4px;font-size:20px;background:linear-gradient(135deg,var(--primary),#ff9a6c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .peach-card .peach-sub{margin:0 0 18px;color:var(--muted);font-size:13px}
    .peach-input-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .peach-input{height:42px;border-radius:999px;border:1px solid var(--border);padding:0 16px;font:inherit;width:220px;outline:none;transition:.2s}
    .peach-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,61,140,.12)}
    .peach-btn{height:42px;padding:0 20px;border-radius:999px;border:none;background:linear-gradient(135deg,#ff6aa8,#ff9a6c);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 8px 22px rgba(255,106,168,.28);transition:.2s}
    .peach-btn:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(255,106,168,.35)}
    .peach-btn:active{transform:translateY(0)}
    .peach-result{margin-top:18px;padding:18px;border-radius:14px;background:linear-gradient(135deg,rgba(255,106,168,.06),rgba(255,154,108,.06));border:1px dashed rgba(255,106,168,.25);display:none}
    .peach-result.show{display:block;animation:peachFadeIn .4s ease}
    @keyframes peachFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .peach-emoji{font-size:36px;margin-bottom:6px}
    .peach-level{font-size:18px;font-weight:800;color:var(--primary);margin:4px 0}
    .peach-desc{color:var(--muted);font-size:14px;line-height:1.7}
    .peach-petal{position:fixed;pointer-events:none;z-index:30;font-size:20px;animation:petalFall 3s ease-in forwards}
    @keyframes petalFall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(85vh) rotate(360deg)}}
  </style>
</head>
<body>
  <canvas id="bgCanvas" class="bg-canvas"></canvas>
  <div id="cursorGlow" class="cursor-glow"></div>
  <div class="container">
    <header>
      <div class="logo"><div class="logo-badge"></div> <span class="wordmark glow-text">LICK.DOG</span></div>
      <!-- 顶部导航移除（按要求去掉“后台 GitHub”文字） -->
      <div></div>
    </header>

    <section class="hero">
      <!-- 移除标签与副标题，改为居中品牌字样（中文） -->
      <h1 class="wordmark glow-text" style="font-size:clamp(44px,8vw,86px);margin-top:6px;">舔狗日记</h1>

      <div class="quote-card" onclick="copyText()" title="点击复制">
        <div class="quote-mark">“</div>
        <div id="quote">正在从数据库加载舔狗语录...</div>
        <div class="hint">点击卡片即可复制</div>
      </div>

      <div class="actions">
        <!-- 搭配：描边款（用这个舔） -->
        <button class="btn-sound btn-sound-outline" onclick="copyText()"><span>用这个舔</span></button>
        <!-- 吸睛款：我要帮舔（更想点） -->
        <button class="btn-sound btn-sound-accent" onclick="openModal()"><span class="shine"></span><span>我要帮舔</span></button>
        <!-- 主色填充 + 扫光（换一个舔） -->
        <button class="btn-sound btn-sound-primary" onclick="fetchQuote()"><span class="shine"></span><span>换一个舔</span></button>
      </div>

      <div class="features">
        <div class="feature"><h3>轻操作</h3><p>无需登录，直接使用</p></div>
        <div class="feature"><h3>匿名投稿</h3><p>五秒提交一条</p></div>
        <div class="feature"><h3>一键复制</h3><p>复制后即可转发</p></div>
      </div>
    </section>

    <!-- 桃花运占卜 -->
    <section class="peach-section">
      <div class="peach-card">
        <h2>🍑 桃花运占卜</h2>
        <p class="peach-sub">输入你的名字，测测你今天的桃花运</p>
        <div class="peach-input-row">
          <input class="peach-input" id="peachName" placeholder="输入名字（留空也行）" maxlength="20" />
          <button class="peach-btn" onclick="divinePeach()">开始占卜</button>
        </div>
        <div id="peachResult" class="peach-result">
          <div class="peach-emoji" id="peachEmoji"></div>
          <div class="peach-level" id="peachLevel"></div>
          <div class="peach-desc" id="peachDesc"></div>
        </div>
      </div>
    </section>


  </div>

  <!-- 投稿弹窗 -->
  <div id="modal" class="modal-wrap" onclick="if(event.target.id==='modal')closeModal()">
    <div class="modal">
      <h2>换我来舔吗？</h2>
      <p>如果我这么说Ta会感动的吧？</p>
      <textarea id="submitText" placeholder="比如：你一天没回我，我还在想是不是你今天太忙了。"></textarea>
      <div class="modal-actions" style="gap:12px;justify-content:flex-end">
        <!-- 1 极简：先不舔了（无扫光） -->
        <button class="btn-sound" onclick="closeModal()"><span>先不舔了</span></button>
        <!-- 3 扫光：我来舔一下 -->
        <button class="btn-sound btn-sound-primary" onclick="submitQuote()"><span class="shine"></span><span>我来舔一下</span></button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    async function fetchQuote(){
      const el=document.getElementById('quote');
      el.style.opacity=.5;
      try{
        const r=await fetch('/api/quote');
        const d=await r.json();
        el.textContent=d.content;
      }catch(e){el.textContent='网络出错了，就像我们的关系一样，一直没真正连上。'}
      el.style.opacity=1;
    }
    function copyText(){
      const t=document.getElementById('quote').innerText;
      navigator.clipboard.writeText(t).then(()=>toast('已复制'));
    }
    async function submitQuote(){
      const text=document.getElementById('submitText').value.trim();
      if(!text)return toast('写点东西吧，沉默是舔不到的。');
      try{
        const r=await fetch('/api/quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:text})});
        const d=await r.json();
        if(r.ok){toast(d.message||'投稿成功');document.getElementById('submitText').value='';closeModal();}
        else toast(d.error||'提交失败');
      }catch(e){toast('提交失败，可能服务器也失恋了。')}
    }
    function openModal(){document.getElementById('modal').style.display='flex'}
    function closeModal(){document.getElementById('modal').style.display='none'}
    function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__TT);window.__TT=setTimeout(()=>t.classList.remove('show'),2000)}
    fetchQuote();

    // 鼠标发光跟随（轻量）
    (()=>{
      const glow=document.getElementById('cursorGlow');
      let tx=0, ty=0, x=0, y=0, visible=false;
      const lerp=(a,b,t)=>a+(b-a)*t;
      const onMove=e=>{tx=e.clientX-70; ty=e.clientY-70; visible=true;};
      const onLeave=()=>{visible=false;};
      window.addEventListener('pointermove', onMove, {passive:true});
      window.addEventListener('pointerleave', onLeave, {passive:true});
      function frame(){
        x=lerp(x,tx,.18); y=lerp(y,ty,.18);
        glow.style.transform=`translate(${x}px,${y}px)`;
        glow.style.opacity=visible? .9 : 0;
        requestAnimationFrame(frame);
      }
      frame();
    })();

    // 背景粒子（柔和、低功耗）
    ;(()=>{
      const c=document.getElementById('bgCanvas');
      const dpr=Math.min(window.devicePixelRatio||1,2);
      const ctx=c.getContext('2d');
      let w=0,h=0, parts=[], mx=-9999, my=-9999;
      function resize(){ w=window.innerWidth; h=window.innerHeight; c.width=w*dpr; c.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
      function rand(a,b){return a+Math.random()*(b-a)}
      function init(){
        parts=[]; const count=Math.floor(Math.min(60, w*h/30000));
        for(let i=0;i<count;i++){
          parts.push({x:rand(0,w),y:rand(0,h), r:rand(12,34),
            vx:rand(-0.2,0.2), vy:rand(-0.2,0.2),
            base:`rgba(255, ${Math.floor(rand(90,150))}, ${Math.floor(rand(140,200))}, `});
        }
      }
      function draw(){
        ctx.clearRect(0,0,w,h);
        ctx.globalCompositeOperation='lighter';
        for(const p of parts){
          const dx=p.x-mx, dy=p.y-my; const dist=Math.hypot(dx,dy)||1;
          const ax= dx/dist * 0.08, ay= dy/dist * 0.08; // 轻微排斥
          if(dist<180){ p.vx += ax; p.vy += ay; }
          p.x+=p.vx; p.y+=p.vy; p.vx*=0.995; p.vy*=0.995;
          if(p.x<-50) p.x=w+50; if(p.x>w+50) p.x=-50; if(p.y<-50) p.y=h+50; if(p.y>h+50) p.y=-50;
          const grad=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
          grad.addColorStop(0, p.base+'0.25)');
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
        }
        ctx.globalCompositeOperation='source-over';
        requestAnimationFrame(draw);
      }
      resize(); init(); draw();
      window.addEventListener('resize', ()=>{resize(); init();});
      window.addEventListener('pointermove', e=>{mx=e.clientX; my=e.clientY;}, {passive:true});
      window.addEventListener('pointerleave', ()=>{mx=-9999; my=-9999;}, {passive:true});
    })();

    /* 桃花运占卜 */
    const peachLevels=[
      {emoji:"🌸",level:"桃花朵朵开",descs:["今天你的魅力值拉满，走到哪里都是焦点，有人正在偷偷关注你。","月老今天加班了，红线已经系好，记得出门打扮一下。","你的桃花运正在疯狂输出，今天遇到的人都可能变成故事。","有人在暗处看你笑的样子，想了很多遍。"]},
      {emoji:"🍑",level:"桃花正旺",descs:["今天适合主动出击，一句话就能撩到心坎里。","你今天自带滤镜，怎么看怎么好看，异性缘爆棚。","有人正在编辑一段话又删掉，反复犹豫要不要找你。","今天遇到的陌生人里，有一个和你有故事的缘份。"]},
      {emoji:"🌺",level:"桃花微开",descs:["你的桃花运正在酝酿中，再等等，好戏在后头。","今天有人想找你聊天但又不好意思开口，你可以主动一点。","月老今天摸鱼了，但你的好运还在路上。","今天适合发朋友圈，会有人悄悄点进去看。"]},
      {emoji:"🪻",level:"桃花待放",descs:["你的桃花运今天比较安静，适合自我提升，明天再战。","月老今天请假了，但你的魅力值还在线。","今天适合独处，给自己充充电，桃花自然来。","别急，最好的总在不经意间出现。"]},
      {emoji:"🥀",level:"桃花暂歇",descs:["今天你的桃花运在休息，但这不代表你不优秀。","月老今天去旅游了，你先忙自己的事吧。","今天适合搞钱，感情的事明天再说。","单身是暂时的，优秀是永恒的。"]}
    ];
    const peachTips=[
      "记住：舔狗不得house，但桃花运可以有house。",
      "今日宜：主动说晚安。忌：已读不回。",
      "小贴士：回复消息快一点，桃花运会更好哦。",
      "温馨提示：喜欢就去追，别等桃花谢了才后悔。",
      "今日幸运色：粉色。幸运动作：微笑。"
    ];
    function divinePeach(){
      const name=document.getElementById('peachName').value.trim()||'你';
      const idx=Math.floor(Math.random()*peachLevels.length);
      const level=peachLevels[idx];
      const desc=level.descs[Math.floor(Math.random()*level.descs.length)];
      const tip=peachTips[Math.floor(Math.random()*peachTips.length)];
      document.getElementById('peachEmoji').textContent=level.emoji;
      document.getElementById('peachLevel').textContent=name+'的桃花运：'+level.level;
      document.getElementById('peachDesc').textContent=desc+' '+tip;
      const r=document.getElementById('peachResult');
      r.classList.remove('show');
      void r.offsetWidth;
      r.classList.add('show');
      spawnPetals();
    }
    function spawnPetals(){
      const petals=['🌸','🍑','💮','🩷','✨','💕'];
      for(let i=0;i<12;i++){
        setTimeout(()=>{
          const el=document.createElement('div');
          el.className='peach-petal';
          el.textContent=petals[Math.floor(Math.random()*petals.length)];
          el.style.left=Math.random()*100+'vw';
          el.style.animationDuration=(2+Math.random()*2)+'s';
          document.body.appendChild(el);
          setTimeout(()=>el.remove(),4000);
        },i*120);
      }
    }
  </script>
