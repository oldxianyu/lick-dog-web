<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#3d203b" />
  <title>LICK.DOG Admin · 内容档案室</title>
  <style>
    :root{--paper:#f8f3ed;--paper-deep:#eee1d5;--ink:#261c2d;--plum:#3d203b;--plum-2:#5e3857;--coral:#ed5e78;--peach:#f7aa87;--mint:#4f9e80;--muted:#82757e;--line:rgba(61,32,59,.14);--shadow:0 26px 70px rgba(61,32,59,.15);--display:"STKaiti","KaiTi","Kaiti SC","Songti SC",serif;--body:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}
    html{min-height:100%;scroll-behavior:smooth}
    body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);background:radial-gradient(circle at 8% 0%,rgba(237,94,120,.18),transparent 28rem),radial-gradient(circle at 100% 12%,rgba(247,170,135,.2),transparent 24rem),linear-gradient(135deg,var(--paper),#fcf8f3 58%,var(--paper-deep));overflow-x:hidden}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E")}
    button,input{font:inherit}
    button{cursor:pointer}
    .shell{width:min(1180px,calc(100% - 40px));margin:0 auto;padding:36px 0 60px;position:relative;z-index:1}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;z-index:1}
    .login-card,.panel{border:1px solid var(--line);background:rgba(255,252,248,.76);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .login-card{width:min(500px,100%);padding:38px;border-radius:30px;position:relative;overflow:hidden}
    .login-card::after{content:"✦";position:absolute;right:28px;top:20px;color:var(--coral);font-size:36px;transform:rotate(14deg);opacity:.7}
    .brand{display:flex;align-items:center;gap:12px;color:var(--plum);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}
    .brand img{width:42px;height:42px;object-fit:contain;padding:5px;border-radius:14px;background:#fff;border:1px solid var(--line)}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--plum-2);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 5px rgba(237,94,120,.12)}
    h1,h2,h3{font-family:var(--display);font-weight:700;color:var(--plum)}
    h1{font-size:clamp(42px,8vw,70px);line-height:.98;letter-spacing:-.06em;margin:26px 0 14px}
    h2{font-size:clamp(30px,5vw,48px);line-height:1;margin:10px 0 0;letter-spacing:-.05em}
    h3{font-size:24px;margin:0;letter-spacing:-.03em}
    .lede,.topbar p{color:var(--muted);line-height:1.8;font-size:14px;margin:0}
    .form-grid{display:grid;gap:12px;margin-top:28px}
    .field{display:grid;gap:8px}
    .field label{font-size:12px;color:var(--plum-2);font-weight:800;letter-spacing:.05em}
    input{width:100%;height:52px;border:1px solid var(--line);border-radius:15px;padding:0 16px;color:var(--ink);background:rgba(255,255,255,.62);outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
    input::placeholder{color:#a0959b}
    input:focus{border-color:rgba(237,94,120,.7);background:#fff;box-shadow:0 0 0 4px rgba(237,94,120,.12)}
    .btn{min-height:44px;border:0;border-radius:999px;padding:0 18px;font-size:13px;font-weight:800;transition:transform .2s,box-shadow .2s,background .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .btn:hover{transform:translateY(-2px)}
    .btn:disabled{opacity:.58;cursor:wait;transform:none}
    .btn-primary{color:#fff;background:var(--plum);box-shadow:0 12px 24px rgba(61,32,59,.2)}
    .btn-primary:hover{background:var(--plum-2);box-shadow:0 16px 30px rgba(61,32,59,.24)}
    .btn-quiet{color:var(--plum);background:rgba(61,32,59,.06);border:1px solid var(--line)}
    .btn-danger{color:#fff;background:var(--coral);box-shadow:0 10px 20px rgba(237,94,120,.2)}
    .login-note{display:flex;align-items:center;gap:8px;margin:18px 0 0;color:var(--muted);font-size:12px}
    .login-note::before{content:"⌁";color:var(--coral);font-size:20px}
    .dashboard{display:none}
    .topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:28px 30px;border-radius:28px;margin-bottom:18px}
    .topbar .brand{margin-bottom:20px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap}
    .status{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;background:rgba(79,158,128,.1);color:#387c62;font-size:12px;font-weight:800;white-space:nowrap}
    .status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 5px rgba(79,158,128,.12)}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
    .summary-card{padding:22px;border-radius:22px;position:relative;overflow:hidden}
    .summary-card::after{position:absolute;right:18px;bottom:10px;font-size:42px;font-family:var(--display);color:var(--coral);opacity:.18}
    .summary-card:nth-child(1)::after{content:"Ⅰ"}.summary-card:nth-child(2)::after{content:"♡"}.summary-card:nth-child(3)::after{content:"⌁"}
    .summary-card strong{display:block;color:var(--plum);font-family:var(--display);font-size:42px;line-height:1;margin-bottom:9px}
    .summary-card small{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.06em}
    .list-card{border-radius:28px;padding:22px}
    .list-head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:18px}
    .list-head p{color:var(--muted);font-size:12px;margin:6px 0 0}
    .search{width:min(260px,100%);height:42px}
    #list{display:grid;gap:12px}
    .quote-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;padding:20px 20px 20px 22px;border:1px solid rgba(61,32,59,.1);border-radius:20px;background:rgba(255,255,255,.58);transition:transform .2s,box-shadow .2s,border-color .2s}
    .quote-item:hover{transform:translateY(-2px);border-color:rgba(237,94,120,.35);box-shadow:0 15px 34px rgba(61,32,59,.08)}
    .quote-item.status-active{box-shadow:inset 3px 0 0 var(--mint)}
    .quote-item.status-hidden{box-shadow:inset 3px 0 0 var(--coral);background:rgba(61,32,59,.035)}
    .quote-item.status-hidden .content-text{color:#958a91;text-decoration:line-through;text-decoration-color:rgba(237,94,120,.55)}
    .meta{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px}
    .badge{display:inline-flex;align-items:center;height:25px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:800}
    .badge-live{background:rgba(79,158,128,.12);color:#387c62}.badge-dead{background:rgba(237,94,120,.12);color:#c64d65}
    .timestamp{color:#a0959b;font-size:12px}
    .content-text{font-family:var(--display);font-size:23px;line-height:1.45;word-break:break-word;color:var(--plum)}
    .actions{display:flex;align-items:center;gap:8px}
    .actions .btn{min-width:76px;min-height:38px;padding:0 14px}
    .empty{padding:52px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
    .empty strong{display:block;font-family:var(--display);font-size:28px;color:var(--plum);margin-bottom:6px}
    .loading{color:var(--muted);padding:36px;text-align:center}
    .error{margin-top:12px;padding:11px 13px;border-radius:12px;background:rgba(237,94,120,.1);color:#b5435c;font-size:13px;line-height:1.5}
    .toast{position:fixed;left:50%;bottom:24px;z-index:10;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--plum);color:#fff;padding:12px 17px;border-radius:999px;box-shadow:0 14px 30px rgba(61,32,59,.25);font-size:13px;transition:opacity .2s,transform .2s}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media (max-width:760px){.shell{width:min(100% - 24px,560px);padding-top:18px}.login-card{padding:28px 22px}.topbar{align-items:flex-start;flex-direction:column;padding:23px}.toolbar,.toolbar .btn{width:100%}.summary{grid-template-columns:1fr}.list-card{padding:14px}.list-head{align-items:stretch;flex-direction:column;gap:12px}.search{width:100%}.quote-item{grid-template-columns:1fr;padding:17px}.actions,.actions .btn{width:100%}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <section id="login-panel" class="login-wrap" aria-labelledby="login-title">
    <div class="login-card">
      <div class="brand"><img src="/shiba_preview.svg" alt="" /> <span>LICK.DOG / PRIVATE ARCHIVE</span></div>
      <div class="eyebrow" style="margin-top:32px">内容档案室 · ADMIN</div>
      <h1 id="login-title">后台登录</h1>
      <p class="lede">审核投稿、整理展示状态，让前台继续保持一点卑微、一点浪漫。</p>
      <form id="login-form" class="form-grid">
        <div class="field"><label for="username">管理员账号</label><input id="username" name="username" autocomplete="username" placeholder="输入账号" required /></div>
        <div class="field"><label for="password">访问密码</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入密码" required /></div>
        <button id="login-button" class="btn btn-primary" type="submit">进入档案室 <span aria-hidden="true">↗</span></button>
        <div id="login-error" class="error" role="alert" hidden></div>
      </form>
      <div class="login-note">仅限站点管理员使用 · 登录凭证不会显示在页面上</div>
    </div>
  </section>

  <main id="dashboard" class="dashboard shell">
    <section class="panel topbar">
      <div>
        <div class="brand"><img src="/shiba_preview.svg" alt="" /> <span>LICK.DOG / PRIVATE ARCHIVE</span></div>
        <h2>舔狗总司令部</h2>
        <p>审核投稿，控制展示状态，维护前台的整体气质。</p>
      </div>
      <div class="toolbar"><span class="status">数据库已连接</span><button id="refresh-button" class="btn btn-quiet" type="button">刷新列表</button><button id="logout-button" class="btn btn-quiet" type="button">退出登录</button></div>
    </section>

    <section id="summary" class="summary" aria-label="数据摘要">
      <div class="panel summary-card"><strong id="stat-total">—</strong><small>总语录数 / ARCHIVE</small></div>
      <div class="panel summary-card"><strong id="stat-live">—</strong><small>展示中 / LIVE</small></div>
      <div class="panel summary-card"><strong id="stat-hidden">—</strong><small>已隐藏 / HIDDEN</small></div>
    </section>

    <section class="panel list-card">
      <div class="list-head"><div><h3>语录档案</h3><p>绿色标记为当前展示，珊瑚色标记为已隐藏。</p></div><input id="search" class="search" type="search" placeholder="搜索语录内容" aria-label="搜索语录内容" /></div>
      <div id="list" aria-live="polite"><div class="loading">正在打开档案室…</div></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const loginPanel = document.getElementById('login-panel');
    const dashboard = document.getElementById('dashboard');
    const loginForm = document.getElementById('login-form');
    const loginButton = document.getElementById('login-button');
    const loginError = document.getElementById('login-error');
    const list = document.getElementById('list');
    const search = document.getElementById('search');
    let quotes = [];
    let toastTimer;

    function getToken(){ return localStorage.getItem('lick_token') || ''; }
    function showToast(message){ const el=document.getElementById('toast'); el.textContent=message; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2600); }
    function setLoginError(message=''){ loginError.textContent=message; loginError.hidden=!message; }
    function setLoginBusy(busy){ loginButton.disabled=busy; loginButton.innerHTML=busy?'验证中…':'进入档案室 <span aria-hidden="true">↗</span>'; }

    async function readJson(response){
      const text=await response.text();
      try{return text?JSON.parse(text):{}}catch{return{error:'服务器返回了无法识别的内容'}}
    }

    async function login(event){
      event.preventDefault(); setLoginError(''); setLoginBusy(true);
      const username=document.getElementById('username').value.trim();
      const password=document.getElementById('password').value;
      try{
        const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
        const data=await readJson(response);
        if(!response.ok||!data.success) throw new Error(data.error||'账号或密码错误');
        localStorage.setItem('lick_token',data.token); showDashboard();
      }catch(error){setLoginError(error.message||'登录失败，请稍后再试')}
      finally{setLoginBusy(false)}
    }

    function showDashboard(){ loginPanel.style.display='none'; dashboard.style.display='block'; loadQuotes(); }
    function logout(message=''){ localStorage.removeItem('lick_token'); dashboard.style.display='none'; loginPanel.style.display='grid'; if(message) setLoginError(message); }
    function updateSummary(){
      const live=quotes.filter(q=>Number(q.is_approved)===1).length;
      document.getElementById('stat-total').textContent=quotes.length;
      document.getElementById('stat-live').textContent=live;
      document.getElementById('stat-hidden').textContent=quotes.length-live;
    }
    function renderQuotes(){
      const keyword=search.value.trim().toLowerCase();
      const filtered=quotes.filter(q=>String(q.content||'').toLowerCase().includes(keyword));
      list.textContent='';
      if(!filtered.length){const empty=document.createElement('div');empty.className='empty';const title=document.createElement('strong');title.textContent=quotes.length?'没有匹配的语录':'档案室还是空的';empty.append(title,document.createTextNode(quotes.length?'换个关键词试试。':'还没有可以整理的投稿。'));list.appendChild(empty);return}
      filtered.forEach(q=>{
        const live=Number(q.is_approved)===1; const item=document.createElement('article'); item.className='quote-item '+(live?'status-active':'status-hidden');
        const body=document.createElement('div'); const meta=document.createElement('div'); meta.className='meta';
        const badge=document.createElement('span'); badge.className='badge '+(live?'badge-live':'badge-dead'); badge.textContent=live?'展示中':'已隐藏';
        const time=document.createElement('span'); time.className='timestamp'; time.textContent=q.created_at?new Date(q.created_at).toLocaleString('zh-CN'):'未知时间';
        const content=document.createElement('div'); content.className='content-text'; content.textContent=String(q.content||'');
        meta.append(badge,time); body.append(meta,content);
        const actions=document.createElement('div'); actions.className='actions'; const button=document.createElement('button'); button.type='button'; button.className='btn '+(live?'btn-danger':'btn-primary'); button.textContent=live?'隐藏':'恢复'; button.addEventListener('click',()=>toggleStatus(q.id,live?'delete':'approve',button)); actions.appendChild(button); item.append(body,actions); list.appendChild(item);
      });
    }
    async function loadQuotes(){
      list.innerHTML='<div class="loading">正在同步档案…</div>';
      try{const response=await fetch('/api/admin',{headers:{Authorization:getToken()}}); if(response.status===401){logout('登录已过期，请重新登录');return} const data=await readJson(response); if(!response.ok||!Array.isArray(data)) throw new Error(data.error||'读取档案失败'); quotes=data; updateSummary(); renderQuotes();}
      catch(error){list.innerHTML='';const empty=document.createElement('div');empty.className='empty';const title=document.createElement('strong');title.textContent='档案同步失败';empty.append(title,document.createTextNode(error.message||'请刷新后重试。'));list.appendChild(empty)}
    }
    async function toggleStatus(id,action,button){
      if(action==='delete'&&!window.confirm('确定隐藏这条语录吗？它不会被删除，之后仍可恢复。')) return;
      button.disabled=true;
      try{const response=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json',Authorization:getToken()},body:JSON.stringify({id,action})});const data=await readJson(response);if(response.status===401){logout('登录已过期，请重新登录');return}if(!response.ok||!data.success)throw new Error(data.error||'操作失败');showToast(action==='delete'?'已隐藏这条语录':'已恢复这条语录');await loadQuotes();}
      catch(error){showToast(error.message||'操作失败');button.disabled=false}
    }
    loginForm.addEventListener('submit',login); document.getElementById('refresh-button').addEventListener('click',loadQuotes); document.getElementById('logout-button').addEventListener('click',()=>logout()); search.addEventListener('input',renderQuotes);
    if(getToken()) showDashboard();
  </script>
</body>
</html>
